<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield" x1="256" y1="36" x2="256" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2330"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>
    <linearGradient id="rim" x1="60" y1="36" x2="452" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0b90b"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="curve" x1="110" y1="0" x2="402" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.55" stop-color="#f0b90b"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 40 L452 110 V300 C452 384 360 452 256 482 C152 452 60 384 60 300 V110 Z"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- shield body -->
  <path d="M256 40 L452 110 V300 C452 384 360 452 256 482 C152 452 60 384 60 300 V110 Z"
        fill="url(#shield)" stroke="url(#rim)" stroke-width="14" stroke-linejoin="round"/>

  <!-- faint grid inside -->
  <g clip-path="url(#shieldClip)" stroke="#2a3442" stroke-width="2" opacity="0.6">
    <line x1="60" y1="190" x2="452" y2="190"/>
    <line x1="60" y1="260" x2="452" y2="260"/>
    <line x1="60" y1="330" x2="452" y2="330"/>
  </g>

  <!-- equity curve: rise to a peak, crash, recover higher (capital preservation) -->
  <g clip-path="url(#shieldClip)" filter="url(#glow)">
    <path d="M112 330 L168 250 L214 196 L262 244 L306 338 L350 286 L402 196"
          fill="none" stroke="url(#curve)" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- recovery endpoint dot -->
    <circle cx="402" cy="196" r="14" fill="#3fb950"/>
  </g>
</svg>
